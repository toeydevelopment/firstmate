name: SF Overlay Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sf-overlay-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  overlay:
    name: Overlay layout and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Fetch upstream for the layout test
        run: |
          git remote add upstream https://github.com/kunchenguid/firstmate
          git fetch upstream main
      - name: Documentation audience check
        run: bin/fm-doc-audience-check.sh
      - name: Factory tests
        run: |
          for t in factory/tests/*.test.sh; do
            echo "== $t"
            bash "$t"
          done
